train:
  output_root: artifacts/studies
  model_family: frcnet_source_invariant

  training:
    seed: 7
    phases:
      - name: warmup
        epoch_count: 5
        enabled_cohorts: [easy_id, unknown_supervision]
        lr_scale: 1.0
        dataloader:
          source_balanced_sampling: false
        loss_overrides:
          unknown_content_entropy_weight: 0.5
          ood_supcon_weight: 0.05
      - name: main
        epoch_count: 20
        enabled_cohorts: [easy_id, hard_id, ambiguous_id, unknown_supervision]
        lr_scale: 1.0
        dataloader:
          source_balanced_sampling: true
        loss_overrides:
          hard_id_label_smoothing: 0.1
          unknown_content_entropy_weight: 0.25
          weight_ambiguous: 1.1
          hard_id_resolution_floor: 0.8
          hard_id_resolution_weight: 0.25
      - name: stabilize
        epoch_count: 5
        enabled_cohorts: [easy_id, hard_id, ambiguous_id, unknown_supervision]
        lr_scale: 0.25
        dataloader:
          source_balanced_sampling: true
        loss_overrides:
          weight_id: 0.75
          weight_ambiguous: 1.25
          unknown_content_entropy_weight: 0.35
          hard_id_label_smoothing: 0.1
          hard_id_resolution_floor: 0.85
          hard_id_resolution_weight: 0.3

  runtime:
    backend: auto
    dtype: float32
    amp_enabled: false
    pin_memory: auto

  dataloader:
    batch_size: 64
    shuffle: true
    drop_last: true
    num_workers: 0
    persistent_workers: false
    pin_memory: auto
    source_balanced_sampling: true
    batch_composition:
      id_fraction: 0.25
      ambiguous_fraction: 0.25
      ood_fraction: 0.50
    ood_cohorts: [unknown_supervision]

  optimizer:
    name: adamw
    lr: 0.0005
    weight_decay: 0.0001
    betas: [0.9, 0.999]

  loss:
    weight_id: 1.0
    weight_unknown: 1.0
    weight_ambiguous: 1.0
    unknown_content_entropy_weight: 0.0
    source_adv_weight: 0.05
    ood_supcon_weight: 0.10
    source_balanced_calibration_weight: 0.05
    ood_supcon_temperature: 0.1
    hard_id_label_smoothing: 0.0
    hard_id_resolution_floor: 0.0
    hard_id_resolution_weight: 0.0
    hard_id_entropy_ceiling: 0.0
    hard_id_entropy_weight: 0.0
    ambiguous_entropy_floor_margin: 0.0
    ambiguous_entropy_floor_weight: 0.0
    ambiguous_resolution_target: 0.8
    ambiguous_resolution_weight: 1.0

  checkpointing:
    save_every_epochs: 1
    primary_policy: balanced

  validation:
    dataloader:
      batch_size: 128
      shuffle: false
      drop_last: false
      num_workers: 0
      persistent_workers: false
      pin_memory: auto
