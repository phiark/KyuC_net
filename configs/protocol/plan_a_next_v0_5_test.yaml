protocol:
  protocol_id: plan_a_next_v0_5_test
  seed: 107
  split_name: test
  output_root: artifacts/reports/generated
  num_classes: 10
  datasets:
    cifar10:
      root: data/cifar10
      train: false
      download: false
    svhn:
      root: data/svhn
      split: test
      download: false
    cifar100:
      root: data/cifar100
      train: false
      download: false
  analysis:
    easy_id_per_class: 200
    hard_id_per_class: 200
    ambiguous_per_pair: 200
    ood_count: 1000
    unknown_supervision_count: 1000
    dataloader:
      batch_size: 128
      drop_last: false
      num_workers: 0
  source_partitions:
    cifar10:
      name: cifar10_test_per_class_200_1000
      class_index_start: 200
      class_index_stop: 1000
    svhn:
      name: svhn_test_global_1000_3000
      index_start: 1000
      index_stop: 3000
    cifar100:
      name: cifar100_test_global_0000_1000
      index_start: 0
      index_stop: 1000
  source_roles:
    cifar10: in_domain
    svhn: seen_source_ood
    cifar100: unseen_ood_source
  ood_sources:
    - dataset_name: svhn
      count: 1000
      source_role: seen_source_ood
    - dataset_name: cifar100
      count: 1000
      source_role: unseen_ood_source
  ambiguous:
    recipes: [mixup, overlay, occlusion]
    alpha_min: 0.35
    alpha_max: 0.65
    class_pairs:
      - [3, 5]
      - [4, 7]
      - [1, 9]
      - [0, 2]
      - [1, 8]
    heldout_class_pairs:
      - [0, 2]
      - [1, 8]
    occlusion_fraction: 0.35
  hard_id:
    recipes: [gaussian_blur, low_res]
    blur_kernel_size: 5
    blur_sigma: 1.0
    low_res_size: 16
  extensions:
    overlay_enabled: true
    occlusion_enabled: true
    noise_enabled: false
    texture_enabled: false
