protocol:
  protocol_id: plan_a_next_v0_2_test
  seed: 107
  split_name: test
  output_root: artifacts/reports/generated
  num_classes: 10
  datasets:
    cifar10:
      root: data/cifar10
      train: false
      download: false
    svhn:
      root: data/svhn
      split: test
      download: false
  analysis:
    easy_id_per_class: 200
    hard_id_per_class: 200
    ambiguous_per_pair: 200
    ood_count: 1000
    unknown_supervision_count: 1000
    dataloader:
      batch_size: 128
      drop_last: false
      num_workers: 0
  ambiguous:
    recipes: [mixup, overlay, occlusion]
    alpha_min: 0.35
    alpha_max: 0.65
    class_pairs:
      - [3, 5]
      - [4, 7]
      - [1, 9]
      - [0, 2]
      - [1, 8]
    heldout_class_pairs:
      - [0, 2]
      - [1, 8]
    occlusion_fraction: 0.35
  hard_id:
    recipes: [gaussian_blur, low_res]
    blur_kernel_size: 5
    blur_sigma: 1.0
    low_res_size: 16
  source_roles:
    svhn: seen_unknown_source
  extensions:
    overlay_enabled: true
    occlusion_enabled: true
    noise_enabled: false
    texture_enabled: false
