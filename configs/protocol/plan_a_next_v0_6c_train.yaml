protocol:
  protocol_id: plan_a_next_v0_6c_train
  seed: 7
  split_name: train
  output_root: artifacts/reports/generated
  num_classes: 10
  datasets:
    cifar10:
      root: data/cifar10
      train: true
      download: false
    svhn:
      root: data/svhn
      split: train
      download: false
    dtd:
      root: data/dtd
      split: train
      download: false
    lsun_resize:
      root: data/lsun_resize
      split: all
      download: false
    gaussian_noise:
      split: train
      length: 10000
      seed: 6007
      image_size: 32
      mean: 0.5
      std: 0.25
    tiny_imagenet:
      root: data/tiny_imagenet/tiny-imagenet-200
      split: train
      download: false
    cifar100:
      root: data/cifar100
      train: true
      download: false
  analysis:
    easy_id_per_class: 4000
    hard_id_per_class: 500
    ambiguous_per_pair: 500
    ood_count: 0
    unknown_supervision_count: 1800
    dataloader:
      batch_size: 64
      drop_last: true
      num_workers: 0
  source_partitions:
    cifar10:
      name: cifar10_train_all
    svhn:
      name: svhn_train_all
    dtd:
      name: dtd_train_all
    lsun_resize:
      name: lsun_resize_global_0000_1800
      index_start: 0
      index_stop: 1800
    gaussian_noise:
      name: gaussian_noise_train_all
    tiny_imagenet:
      name: tiny_imagenet_train_all
    cifar100:
      name: cifar100_train_seen_classes_000_050
      class_label_start: 0
      class_label_stop: 50
  source_roles:
    cifar10: in_domain
    svhn: seen_unknown_source
    dtd: seen_unknown_source
    lsun_resize: seen_unknown_source
    gaussian_noise: seen_unknown_source
    tiny_imagenet: seen_unknown_source
    cifar100: seen_unknown_source
  source_domains:
    cifar10: {label: 0, name: cifar10}
    svhn: {label: 1, name: svhn}
    dtd: {label: 2, name: dtd}
    lsun_resize: {label: 3, name: lsun_resize}
    gaussian_noise: {label: 4, name: gaussian_noise}
    tiny_imagenet: {label: 5, name: tiny_imagenet}
    cifar100: {label: 6, name: cifar100}
  unknown_sources:
    - dataset_name: svhn
      count: 1800
      source_role: seen_unknown_source
    - dataset_name: dtd
      count: 1800
      source_role: seen_unknown_source
    - dataset_name: lsun_resize
      count: 1800
      source_role: seen_unknown_source
    - dataset_name: gaussian_noise
      count: 1800
      source_role: seen_unknown_source
    - dataset_name: tiny_imagenet
      count: 1800
      source_role: seen_unknown_source
    - dataset_name: cifar100
      count: 1800
      source_role: seen_unknown_source
      source_partition_name: cifar100_train_seen_classes_000_050
      class_label_start: 0
      class_label_stop: 50
  ambiguous:
    recipes: [mixup]
    alpha_min: 0.35
    alpha_max: 0.65
    class_pairs:
      - [3, 5]
      - [4, 7]
      - [1, 9]
  hard_id:
    recipes: [gaussian_blur, low_res]
    blur_kernel_size: 5
    blur_sigma: 1.0
    low_res_size: 16
  extensions:
    overlay_enabled: false
    occlusion_enabled: false
    noise_enabled: false
    texture_enabled: false
