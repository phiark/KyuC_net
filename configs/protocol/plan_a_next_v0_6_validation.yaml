protocol:
  protocol_id: plan_a_next_v0_6_validation
  seed: 7
  split_name: validation
  output_root: artifacts/reports/generated
  num_classes: 10
  datasets:
    cifar10:
      root: data/cifar10
      train: false
      download: false
    svhn:
      root: data/svhn
      split: test
      download: false
    dtd:
      root: data/dtd
      split: val
      download: false
    lsun_resize:
      root: data/lsun_resize
      split: all
      download: false
    gaussian_noise:
      split: validation
      length: 3000
      seed: 6107
      image_size: 32
      mean: 0.5
      std: 0.25
  analysis:
    easy_id_per_class: 50
    hard_id_per_class: 50
    ambiguous_per_pair: 50
    ood_count: 250
    unknown_supervision_count: 0
    dataloader:
      batch_size: 128
      drop_last: false
      num_workers: 0
  source_partitions:
    cifar10:
      name: cifar10_test_per_class_000_200
      class_index_start: 0
      class_index_stop: 200
    svhn:
      name: svhn_test_global_0000_1000
      index_start: 0
      index_stop: 1000
    dtd:
      name: dtd_val_global_0000_1000
      index_start: 0
      index_stop: 1000
    lsun_resize:
      name: lsun_resize_global_1800_2300
      index_start: 1800
      index_stop: 2300
    gaussian_noise:
      name: gaussian_noise_validation_global_0000_1000
      index_start: 0
      index_stop: 1000
  source_roles:
    cifar10: in_domain
    svhn: seen_source_ood
    dtd: seen_source_ood
    lsun_resize: seen_source_ood
    gaussian_noise: seen_source_ood
  source_domains:
    cifar10: {label: 0, name: cifar10}
    svhn: {label: 1, name: svhn}
    dtd: {label: 2, name: dtd}
    lsun_resize: {label: 3, name: lsun_resize}
    gaussian_noise: {label: 4, name: gaussian_noise}
    cifar100: {label: 5, name: cifar100}
  ood_sources:
    - dataset_name: svhn
      count: 250
      source_role: seen_source_ood
    - dataset_name: dtd
      count: 250
      source_role: seen_source_ood
    - dataset_name: lsun_resize
      count: 250
      source_role: seen_source_ood
    - dataset_name: gaussian_noise
      count: 250
      source_role: seen_source_ood
  ambiguous:
    recipes: [mixup]
    alpha_min: 0.35
    alpha_max: 0.65
    class_pairs:
      - [3, 5]
      - [4, 7]
      - [1, 9]
  hard_id:
    recipes: [gaussian_blur, low_res]
    blur_kernel_size: 5
    blur_sigma: 1.0
    low_res_size: 16
  extensions:
    overlay_enabled: false
    occlusion_enabled: false
    noise_enabled: false
    texture_enabled: false
