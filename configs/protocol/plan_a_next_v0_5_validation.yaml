protocol:
  protocol_id: plan_a_next_v0_5_validation
  seed: 7
  split_name: validation
  output_root: artifacts/reports/generated
  num_classes: 10
  datasets:
    cifar10:
      root: data/cifar10
      train: false
      download: false
    svhn:
      root: data/svhn
      split: test
      download: false
  analysis:
    easy_id_per_class: 50
    hard_id_per_class: 50
    ambiguous_per_pair: 50
    ood_count: 500
    unknown_supervision_count: 500
    dataloader:
      batch_size: 128
      drop_last: false
      num_workers: 0
  source_partitions:
    cifar10:
      name: cifar10_test_per_class_000_200
      class_index_start: 0
      class_index_stop: 200
    svhn:
      name: svhn_test_global_0000_1000
      index_start: 0
      index_stop: 1000
  source_roles:
    cifar10: in_domain
    svhn: seen_source_ood
  ood_sources:
    - dataset_name: svhn
      count: 500
      source_role: seen_source_ood
  ambiguous:
    recipes: [mixup]
    alpha_min: 0.35
    alpha_max: 0.65
    class_pairs:
      - [3, 5]
      - [4, 7]
      - [1, 9]
  hard_id:
    recipes: [gaussian_blur, low_res]
    blur_kernel_size: 5
    blur_sigma: 1.0
    low_res_size: 16
  extensions:
    overlay_enabled: false
    occlusion_enabled: false
    noise_enabled: false
    texture_enabled: false
